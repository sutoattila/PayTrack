<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PayTrack for Students</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>PayTrack for Students</h1>
    </div>

    <!-- Navigation Bar -->
    <div class="nav">
        <a href="/home">Home</a>
        <a href="/set-budget">Set Budget</a>
        <a href="/increase-budget">Increase Budget</a>
        <a class="active" href="/add">Add Expense</a>
        <a href="/">Dashboard</a>
    </div>

    <!-- Main Content -->
    <div class="container">
        <h2>Add Expense</h2>

        {% if error %}
        <p style="color: red;">{{ error }}</p>
        {% endif %}

        <form method="POST">
            Amount: <input name="amount" type="number" step="0.01" required><br><br>
            Category:
            <select name="category">
                <option value="food">Food</option>
                <option value="transport">Transport</option>
                <option value="entertainment">Entertainment</option>
            </select><br><br>
            <button type="submit">Add</button>
        </form>
    </div>

</body>
</html>
